<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Hotel Noise Check</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout concept: a night-sky phone app. One airport-lit hero, then calm teal cards that react to each tap. */
:root{
  --font-display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --font-body:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --bg:#061615; --surface:#0d2523; --surface2:#133533; --line:#21504c;
  --fg:#e7f5f2; --muted:#9bbab5;
  --accent:#0f766e; --accent-fg:#ffffff; --accent-text:#3ddbc7; --accent-soft:#0f3a37;
  --noise:#f6a623; --noise-soft:#3b2a0b; --noise-fg:#fbd38d;
  --banner:#0a2422;
  --sky-a:#04201f; --sky-b:#0f4d48; --bldg:#09201f; --bldg2:#0c2d2b; --win:#f6c453; --plane:#d5f1ec; --star-o:.9;
  --shadow:0 10px 30px rgba(0,0,0,.35);
  color-scheme:dark;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#eef6f4; --surface:#ffffff; --surface2:#e6f2f0; --line:#c6dfda;
    --fg:#10302d; --muted:#4d6f6a;
    --accent:#0f766e; --accent-fg:#ffffff; --accent-text:#0f766e; --accent-soft:#e6f2f0;
    --noise:#c2700a; --noise-soft:#fdf0dc; --noise-fg:#8a4a05;
    --banner:#dcece9;
    --sky-a:#a9dcd4; --sky-b:#eaf8f5; --bldg:#2c5c58; --bldg2:#4a7d78; --win:#fff2c0; --plane:#10302d; --star-o:0;
    --shadow:0 10px 30px rgba(16,48,45,.12);
    color-scheme:light;
  }
}
:root[data-theme="light"]{
  --bg:#eef6f4; --surface:#ffffff; --surface2:#e6f2f0; --line:#c6dfda;
  --fg:#10302d; --muted:#4d6f6a;
  --accent:#0f766e; --accent-fg:#ffffff; --accent-text:#0f766e; --accent-soft:#e6f2f0;
  --noise:#c2700a; --noise-soft:#fdf0dc; --noise-fg:#8a4a05;
  --banner:#dcece9;
  --sky-a:#a9dcd4; --sky-b:#eaf8f5; --bldg:#2c5c58; --bldg2:#4a7d78; --win:#fff2c0; --plane:#10302d; --star-o:0;
  --shadow:0 10px 30px rgba(16,48,45,.12);
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:17px;line-height:1.5;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--banner);z-index:30}
.gutter{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.banner{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--banner);border-bottom:1px solid var(--line)}
.banner .gutter{max-width:520px;margin:0 auto;padding-block:7px;font-size:.72rem;text-align:center;color:var(--muted);letter-spacing:.01em}
#app{max-width:520px;margin:0 auto;min-height:calc(100% - 33px);display:flex;flex-direction:column}
.progress{display:flex;gap:6px;padding-block:14px 4px}
.progress i{flex:1;height:5px;border-radius:3px;background:var(--line);overflow:hidden;position:relative}
.progress i::after{content:"";position:absolute;inset:0;background:var(--accent-text);transform:scaleX(0);transform-origin:left;transition:transform .5s ease}
.progress i.on::after{transform:scaleX(1)}
#view{flex:1;display:flex;flex-direction:column;padding-block:14px 8px;animation:rise .45s ease}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.foot{padding-block:10px 22px;text-align:center;font-size:.72rem;color:var(--muted)}
.kicker{font-size:.74rem;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--accent-text);margin:2px 0 8px}
h1,h2{font-family:var(--font-display);text-wrap:balance;letter-spacing:-.015em;margin:0 0 12px}
h1{font-size:2rem;line-height:1.1;font-weight:800}
h2{font-size:1.45rem;line-height:1.2;font-weight:700}
p{margin:0 0 12px}
.muted{color:var(--muted)}
.spacer{flex:1;min-height:18px}
.btn{display:block;width:100%;border:0;border-radius:14px;background:var(--accent);color:var(--accent-fg);font:600 1.02rem/1.2 var(--font-body);padding:16px 18px;margin-top:12px;cursor:pointer;text-align:center;transition:transform .15s ease,filter .15s ease,opacity .15s ease;box-shadow:0 6px 18px rgba(15,118,110,.35)}
.btn:hover{filter:brightness(1.1)}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.4;cursor:default;box-shadow:none;filter:none;transform:none}
.btn.ghost{background:transparent;color:var(--accent-text);border:2px solid var(--accent);box-shadow:none}
:focus-visible{outline:3px solid var(--accent-text);outline-offset:2px}
/* hero scene */
.scene{border-radius:20px;overflow:hidden;margin-bottom:18px;border:1px solid var(--line);box-shadow:var(--shadow);line-height:0}
.scene svg{width:100%;height:auto;display:block}
.star{fill:#fff;opacity:var(--star-o)}
.plane{fill:var(--plane);animation:fly 13s linear infinite}
@keyframes fly{0%{transform:translate(-70px,72px)}100%{transform:translate(470px,26px)}}
.ring{fill:none;stroke:var(--accent-text);stroke-width:2;transform-box:fill-box;transform-origin:center;opacity:0;animation:ring 3.6s ease-out infinite}
.ring:nth-of-type(2){animation-delay:1.2s}.ring:nth-of-type(3){animation-delay:2.4s}
@keyframes ring{0%{transform:scale(.4);opacity:.75}100%{transform:scale(5.5);opacity:0}}
.win{fill:var(--win);animation:glow 5s ease-in-out infinite}
@keyframes glow{0%,100%{opacity:.35}50%{opacity:.95}}
/* question cards */
.q{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px;transition:border-color .25s,background .25s}
.q.yes{border-color:var(--noise);background:linear-gradient(0deg,var(--noise-soft),var(--surface))}
.q.no{border-color:var(--accent);background:linear-gradient(0deg,var(--accent-soft),var(--surface))}
.q .qt{font-weight:500;margin:0 0 12px}
.two{display:flex;gap:10px}
.pick{flex:1;min-width:0;border:2px solid var(--line);background:var(--surface2);color:var(--fg);border-radius:12px;padding:12px 8px;font:500 .92rem/1.25 var(--font-body);cursor:pointer;transition:all .2s ease}
.pick:hover{border-color:var(--accent-text)}
.pick:active{transform:scale(.97)}
.pick.sel-yes{background:var(--noise);border-color:var(--noise);color:#1d1403;font-weight:600}
.pick.sel-no{background:var(--accent);border-color:var(--accent);color:var(--accent-fg);font-weight:600}
.count{font-size:.85rem;color:var(--muted);margin:2px 0 4px}
/* result */
.gauge{display:flex;align-items:flex-end;gap:7px;height:44px;margin:4px 0 14px}
.gauge b{width:16px;border-radius:5px 5px 3px 3px;background:var(--surface2);border:1px solid var(--line);transition:background .4s,border-color .4s}
.gauge b:nth-child(1){height:16px}.gauge b:nth-child(2){height:30px}.gauge b:nth-child(3){height:44px}
.gauge b.lit{background:var(--noise);border-color:var(--noise)}
.big{display:flex;align-items:baseline;gap:12px}
.big span.n{font-family:var(--font-display);font-weight:800;font-size:3rem;line-height:1;color:var(--noise-fg)}
.big span.n.zero{color:var(--accent-text)}
.big span.l{color:var(--muted);font-size:.9rem}
/* building */
.bldg-wrap{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px;margin:6px 0 14px}
.seg{display:flex;background:var(--surface2);border-radius:12px;padding:3px;gap:3px;margin:8px 0 12px}
.seg button{flex:1;border:0;background:transparent;color:var(--muted);padding:9px 6px;border-radius:9px;font:500 .85rem/1.2 var(--font-body);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg);font-weight:600}
.bldg{display:grid;grid-template-columns:22px repeat(6,minmax(0,1fr));gap:5px;align-items:center}
.bldg .hd{grid-column:span 3;font-size:.68rem;font-weight:600;text-align:center;letter-spacing:.03em;color:var(--muted);padding-bottom:2px}
.bldg .hd.face{color:var(--accent-text)}
.bldg .fl{font-size:.7rem;color:var(--muted);text-align:center}
.room{height:30px;border-radius:6px;border:1px solid var(--line);background:var(--surface2);padding:0;cursor:pointer;transition:all .18s ease}
.room.face{border-color:var(--accent)}
.room[aria-pressed="true"]{background:var(--noise);border-color:var(--noise);box-shadow:0 0 14px rgba(246,166,35,.55)}
.room:active{transform:scale(.92)}
.bldg.ro .room{cursor:default;height:18px}
.bldg.ro .room:active{transform:none}
.roof{height:8px;border-radius:6px 6px 0 0;background:var(--line);margin:0 0 6px 27px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 14px}
.chip{border:2px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:9px 15px;font:500 .9rem/1 var(--font-body);cursor:pointer;transition:all .18s}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-fg);font-weight:600}
.opts{display:flex;flex-direction:column;gap:8px;margin:8px 0 14px}
.opt{text-align:left;border:2px solid var(--line);background:var(--surface);color:var(--fg);border-radius:12px;padding:12px 14px;font:500 .95rem/1.25 var(--font-body);cursor:pointer;transition:all .18s}
.opt[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-text);font-weight:600}
.sub{font-family:var(--font-display);font-weight:700;font-size:1.05rem;margin:18px 0 2px}
.picture{background:var(--accent-soft);border:1px solid var(--accent);border-radius:16px;padding:14px 16px;margin:6px 0 4px}
.picture h3{margin:0 0 6px;font:600 .74rem/1.2 var(--font-body);letter-spacing:.09em;text-transform:uppercase;color:var(--accent-text)}
.picture ul{margin:0;padding-left:18px}
.picture li{margin:3px 0;font-size:.95rem}
.picture p{font-size:.92rem;margin:8px 0 0;color:var(--muted)}
/* trust */
.trust{border-left:5px solid var(--accent-text);background:var(--accent-soft);padding:20px 20px;border-radius:0 16px 16px 0;font-family:var(--font-display);font-size:1.4rem;line-height:1.3;font-weight:700;margin:6px 0 16px;text-wrap:balance}
.waves{display:flex;align-items:center;gap:4px;height:34px;margin:4px 0 14px}
.waves i{width:4px;border-radius:2px;background:var(--accent-text);opacity:.7;animation:wv 1.6s ease-in-out infinite}
@keyframes wv{0%,100%{height:6px}50%{height:30px}}
/* thanks */
.lead{font-family:var(--font-display);font-size:1.55rem;line-height:1.2;font-weight:800;margin:0 0 12px;text-wrap:balance}
.check{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;border:2px solid var(--line);background:var(--surface);color:var(--fg);border-radius:12px;padding:12px 14px;margin-bottom:8px;font:500 .95rem/1.3 var(--font-body);cursor:pointer;transition:all .18s}
.check .box{flex:none;width:22px;height:22px;border-radius:7px;border:2px solid var(--line);display:grid;place-items:center;color:transparent;font-size:.9rem;transition:all .18s}
.check[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.check[aria-pressed="true"] .box{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
@media (max-width:380px){h1{font-size:1.75rem}.two{flex-direction:column}}
@media (prefers-reduced-motion:reduce){
  #view,.plane,.ring,.win,.waves i{animation:none}
  .plane{transform:translate(130px,50px)}
  .ring{opacity:.35;transform:scale(2)}
  .win{opacity:.8}.waves i{height:18px}
  *{transition:none!important}
}
</style>

<div class="banner"><div class="gutter">Student-built app · research prototype · not an offer from any company.</div></div>
<div id="app">
  <div class="progress gutter" id="progress" aria-hidden="true"></div>
  <main id="view" class="gutter"></main>
  <div class="foot gutter">Team 1 · IBM 4801 × GLIM sprint</div>
</div>

<script>
var C = {
  hook:{headline:"Are Airport Noise Complaints Affecting Your Guests?",line:"Aircraft and traffic noise may affect guest comfort, particularly in rooms facing busy roads or airport activity.",button:"Start Hotel Noise Check"},
  notice:{intro:"Have You Noticed These Noise Issues at Your Hotel?",items:[
    "Have guests complained about aircraft or traffic noise disturbing their sleep?",
    "Have guests experienced more noise disturbances in rooms facing the airport or busy roads?",
    "Have guests repeatedly requested quieter rooms because of outside noise?"],
    after:"Your responses suggest that outside noise may be affecting guest comfort in certain areas of your hotel. Consider reviewing recent guest complaints and checking rooms facing the airport or busy roads to identify when and where these disturbances occur.\n\nUnderstanding these patterns can help you determine whether further evaluation is necessary."},
  trust:{line:"You may not be able to control outside noise, but you can identify where it affects your guests.",why:"Understanding where and when noise disturbances occur can help you determine whether further evaluation or improvements may be needed. Any recommendations should fit your hotel's specific needs, not one brand."},
  next:{line:"Noticed recurring noise concerns? Start by reviewing guest complaints and identifying which rooms may need further attention.",button:"View My Next Step",
    thanks:"Thank you for completing the check!\n\nYour next step is to review recent guest feedback and identify rooms with recurring aircraft or traffic noise complaints. If these concerns continue, consider discussing whether a professional acoustic evaluation would be appropriate.\n\nThis student-built app does not collect or send your information."}
};
var TOTAL = 6; // screens that show progress
var S;
function fresh(){ S = {screen:0, ans:[null,null,null], side:'left', rooms:{}, times:{}, reviewed:null, checks:[false,false]}; }
fresh();

function el(tag, cls, text){ var e=document.createElement(tag); if(cls) e.className=cls; if(text!=null) e.textContent=text; return e; }
function paras(parent, text, cls){ text.split(/\n\n/).forEach(function(p){ parent.appendChild(el('p',cls||'',p)); }); }
function btn(parent, label, fn, cls){ var b=el('button','btn'+(cls?' '+cls:''),label); b.type='button'; b.addEventListener('click',fn); parent.appendChild(b); return b; }
function toggleBtn(cls,label,pressed,fn){ var b=el('button',cls,label); b.type='button'; b.setAttribute('aria-pressed',pressed?'true':'false'); b.addEventListener('click',fn); return b; }
function yesCount(){ return S.ans.filter(function(a){return a==='yes';}).length; }

var view=document.getElementById('view'), prog=document.getElementById('progress');
function go(n){ S.screen=n; render(); window.scrollTo(0,0); }

function render(){
  var node=view.cloneNode(false); view.parentNode.replaceChild(node,view); view=node; // restarts the entrance animation
  prog.innerHTML='';
  for(var i=0;i<TOTAL;i++){ var s=el('i', i<=S.screen?'on':''); prog.appendChild(s); }
  [hook,notice,result,pinpoint,trust,next,thanks][S.screen](view);
}

/* ---------- screen 1: hook ---------- */
function sceneSVG(){
  var wins='';
  for(var r=0;r<5;r++){ for(var c=0;c<4;c++){
    var d=((r*4+c)*0.9)%5; wins+='<rect class="win" x="'+(262+c*21)+'" y="'+(122+r*22)+'" width="12" height="12" rx="2" style="animation-delay:-'+d.toFixed(1)+'s"/>';
  } }
  var stars='';
  [[30,22],[80,48],[140,18],[200,40],[250,14],[330,30],[370,62],[110,84],[20,90],[300,70]].forEach(function(p){ stars+='<circle class="star" cx="'+p[0]+'" cy="'+p[1]+'" r="1.4"/>'; });
  return '<svg viewBox="0 0 400 260" role="img" aria-label="A plane flying over a hotel at night, with sound rings reaching the building">'
   +'<defs><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--sky-a)"/><stop offset="1" style="stop-color:var(--sky-b)"/></linearGradient></defs>'
   +'<rect width="400" height="260" fill="url(#sky)"/>'+stars
   +'<rect x="170" y="150" width="62" height="100" fill="var(--bldg2)"/>'
   +'<rect x="250" y="106" width="100" height="144" rx="3" fill="var(--bldg)"/>'+wins
   +'<rect x="0" y="240" width="400" height="20" fill="var(--bldg)"/>'
   +'<g><circle class="ring" cx="300" cy="100" r="10"/><circle class="ring" cx="300" cy="100" r="10"/><circle class="ring" cx="300" cy="100" r="10"/></g>'
   +'<g class="plane"><path d="M-26 0Q-26 -5 -14 -5L22 -5Q34 -4 38 0Q34 4 22 5L-14 5Q-26 5 -26 0Z"/><path d="M0 0L-12 -20L-5 -20L12 -2Z"/><path d="M0 0L-12 14L-5 14L12 2Z"/><path d="M-22 -3L-30 -14L-24 -14L-14 -3Z"/></g>'
   +'</svg>';
}
function hook(v){
  var sc=el('div','scene'); sc.innerHTML=sceneSVG(); v.appendChild(sc);
  v.appendChild(el('h1','',C.hook.headline));
  v.appendChild(el('p','muted',C.hook.line));
  v.appendChild(el('div','spacer'));
  btn(v,C.hook.button,function(){go(1);});
}

/* ---------- screen 2: the three signs ---------- */
function notice(v){
  v.appendChild(el('div','kicker','Quick check'));
  v.appendChild(el('h2','',C.notice.intro));
  var count=el('div','count',''); count.setAttribute('aria-live','polite');
  var next;
  function upd(){ var n=S.ans.filter(Boolean).length; count.textContent=n+' of 3 answered'; if(next) next.disabled=n<3; }
  C.notice.items.forEach(function(text,i){
    var card=el('div','q'+(S.ans[i]?' '+S.ans[i]:'')); card.appendChild(el('p','qt',text));
    var two=el('div','two');
    [['yes','Yes, this happens here','sel-yes'],['no','Not here','sel-no']].forEach(function(o){
      var b=toggleBtn('pick'+(S.ans[i]===o[0]?' '+o[2]:''),o[1],S.ans[i]===o[0],function(){
        S.ans[i]=o[0]; card.className='q '+o[0];
        Array.prototype.forEach.call(two.children,function(x){ x.className='pick'; x.setAttribute('aria-pressed','false'); });
        b.className='pick '+o[2]; b.setAttribute('aria-pressed','true'); upd();
      });
      two.appendChild(b);
    });
    card.appendChild(two); v.appendChild(card);
  });
  v.appendChild(count);
  v.appendChild(el('div','spacer'));
  next=btn(v,'See what this means',function(){go(2);}); upd();
}

/* ---------- screen 3: what it means ---------- */
function result(v){
  var y=yesCount();
  v.appendChild(el('div','kicker','Your space'));
  var big=el('div','big'); big.appendChild(el('span','n'+(y?'':' zero'),y+' of 3')); big.appendChild(el('span','l','signs recognized')); v.appendChild(big);
  var g=el('div','gauge'); g.setAttribute('aria-hidden','true');
  for(var i=0;i<3;i++) g.appendChild(el('b',''));
  v.appendChild(g);
  setTimeout(function(){ Array.prototype.forEach.call(g.children,function(b,i){ if(i<y) setTimeout(function(){b.classList.add('lit');},i*160); }); },120);
  if(y>0){
    v.appendChild(el('h2','',y===1?'You recognized one of these signs.':'You recognized '+y+' of these signs.'));
    paras(v,C.notice.after);
  } else {
    v.appendChild(el('h2','','None of these happen in your space.'));
    v.appendChild(el('p','',"That's good news: this may not be a problem for you right now. You can still read on."));
  }
  v.appendChild(el('div','spacer'));
  btn(v,'Next',function(){go(3);});
}

/* ---------- screen 4: look closer (optional questions) ---------- */
var FLOORS=5, COLS=6;
function faceCol(c){ return S.side==='left' ? c<3 : c>=3; }
function counts(){
  var a=0,b=0; Object.keys(S.rooms).forEach(function(k){ if(!S.rooms[k]) return; var c=+k.split('-')[1]; if(faceCol(c)) a++; else b++; }); return {a:a,b:b};
}
function building(box, interactive, onChange){
  box.innerHTML='';
  var wrap=el('div'); box.appendChild(wrap);
  wrap.appendChild(el('div','roof'));
  var grid=el('div','bldg'+(interactive?'':' ro')); wrap.appendChild(grid);
  if(interactive){
    grid.appendChild(el('span'));
    var left=S.side==='left';
    grid.appendChild(el('div','hd'+(left?' face':''),left?'Airport / road side':'Other side'));
    grid.appendChild(el('div','hd'+(left?'':' face'),left?'Other side':'Airport / road side'));
  }
  for(var f=FLOORS;f>=1;f--){
    grid.appendChild(el('div','fl',interactive?String(f):''));
    for(var c=0;c<COLS;c++){
      (function(f,c){
        var key=f+'-'+c, on=!!S.rooms[key], cls='room'+(faceCol(c)?' face':'');
        if(interactive){
          var b=el('button',cls); b.type='button'; b.setAttribute('aria-pressed',on?'true':'false');
          b.setAttribute('aria-label','Floor '+f+', room '+(c+1)+(faceCol(c)?', airport or road side':', other side'));
          b.addEventListener('click',function(){ S.rooms[key]=!S.rooms[key]; b.setAttribute('aria-pressed',S.rooms[key]?'true':'false'); onChange(); });
          grid.appendChild(b);
        } else { var d=el('div',cls); d.setAttribute('aria-pressed',on?'true':'false'); grid.appendChild(d); }
      })(f,c);
    }
  }
}
var TIMES=['Late night','Early morning','Daytime','Evening','Not sure'];
function pictureCard(readonlyMap){
  var card=el('div','picture'); card.appendChild(el('h3','','Your noise picture'));
  var ul=el('ul'); var y=yesCount(), k=counts(), any=false;
  function li(t){ ul.appendChild(el('li','',t)); any=true; }
  li('Signs recognized: '+y+' of 3');
  if(k.a+k.b>0){ li('Rooms marked: '+k.a+' on the airport or road side, '+k.b+' on the other side'); }
  var tl=TIMES.filter(function(t){return S.times[t];}); if(tl.length) li('Complaints come in: '+tl.join(', ').toLowerCase());
  if(S.reviewed) li('Recent guest feedback: '+S.reviewed.toLowerCase());
  card.appendChild(ul);
  if(k.a+k.b>0){
    var msg = k.a>k.b ? 'Most of the rooms you marked are on the airport or road side.' : (k.b>k.a ? 'Most of the rooms you marked are on the other side. It may help to note what is near those rooms.' : 'You marked rooms on both sides.');
    card.appendChild(el('p','',msg));
  }
  return card;
}
function pinpoint(v){
  v.appendChild(el('div','kicker','Optional · Look closer'));
  v.appendChild(el('h2','','Where and when do guests hear it?'));
  v.appendChild(el('p','muted','Three quick taps help you see your own pattern. Nothing here is saved or sent.'));

  v.appendChild(el('div','sub','1. Mark the rooms'));
  v.appendChild(el('p','muted','Which side of your hotel faces the airport or busy road? Then tap rooms where guests have mentioned noise.'));
  var wrapB=el('div','bldg-wrap'); v.appendChild(wrapB);
  var seg=el('div','seg'); wrapB.appendChild(seg);
  var boxB=el('div'); wrapB.appendChild(boxB);
  var sumHolder=el('div');
  function refreshSummary(){ sumHolder.innerHTML=''; sumHolder.appendChild(pictureCard()); cont.textContent = hasAny() ? 'Continue' : 'Skip this step'; }
  function drawSeg(){
    seg.innerHTML='';
    [['left','Left side faces it'],['right','Right side faces it']].forEach(function(o){
      seg.appendChild(toggleBtn('',o[1],S.side===o[0],function(){ S.side=o[0]; drawSeg(); building(boxB,true,refreshSummary); refreshSummary(); }));
    });
  }
  function hasAny(){ return counts().a+counts().b>0 || Object.keys(S.times).some(function(t){return S.times[t];}) || !!S.reviewed; }
  drawSeg();

  v.appendChild(el('div','sub','2. When do complaints come in?'));
  var chips=el('div','chips'); v.appendChild(chips);
  function drawChips(){
    chips.innerHTML='';
    TIMES.forEach(function(t){
      chips.appendChild(toggleBtn('chip',t,!!S.times[t],function(){
        if(t==='Not sure'){ var was=!!S.times[t]; S.times={}; if(!was) S.times[t]=true; }
        else { delete S.times['Not sure']; S.times[t]=!S.times[t]; }
        drawChips(); refreshSummary();
      }));
    });
  }
  drawChips();

  v.appendChild(el('div','sub','3. Have you reviewed recent guest feedback for noise?'));
  var opts=el('div','opts'); v.appendChild(opts);
  function drawOpts(){
    opts.innerHTML='';
    ['Yes, I have','Not yet','Not sure'].forEach(function(t){
      opts.appendChild(toggleBtn('opt',t,S.reviewed===t,function(){ S.reviewed=(S.reviewed===t)?null:t; drawOpts(); refreshSummary(); }));
    });
  }
  drawOpts();
  v.appendChild(sumHolder);
  v.appendChild(el('div','spacer'));
  var cont=btn(v,'Skip this step',function(){go(4);});
  building(boxB,true,refreshSummary);
  refreshSummary();
}

/* ---------- screen 5: trust ---------- */
function trust(v){
  v.appendChild(el('div','kicker','How we work'));
  var w=el('div','waves'); w.setAttribute('aria-hidden','true');
  for(var i=0;i<14;i++){ var b=el('i'); b.style.animationDelay=(i*0.12).toFixed(2)+'s'; w.appendChild(b); }
  v.appendChild(w);
  v.appendChild(el('div','trust',C.trust.line));
  v.appendChild(el('p','muted',C.trust.why));
  v.appendChild(el('div','spacer'));
  btn(v,'Next',function(){go(5);});
}

/* ---------- screen 6: one next step ---------- */
function next(v){
  v.appendChild(el('div','kicker','Your next step'));
  v.appendChild(el('h2','',C.next.line));
  v.appendChild(el('div','spacer'));
  btn(v,C.next.button,function(){go(6);});
}

/* ---------- thank you ---------- */
function thanks(v){
  v.appendChild(el('div','kicker','Thank you'));
  var parts=C.next.thanks.split(/\n\n/);
  v.appendChild(el('div','lead',parts[0]));
  v.appendChild(el('p','',parts[1]));
  var k=counts();
  if(k.a+k.b>0){
    var wrap=el('div','bldg-wrap'); var box=el('div'); wrap.appendChild(box); v.appendChild(wrap);
    building(box,false);
  }
  v.appendChild(pictureCard());
  v.appendChild(el('div','sub','Your review checklist'));
  var list=el('div'); v.appendChild(list);
  var items=['Review recent guest feedback','Identify rooms with recurring aircraft or traffic noise complaints'];
  items.forEach(function(t,i){
    var b=el('button','check'); b.type='button'; b.setAttribute('aria-pressed',S.checks[i]?'true':'false');
    b.appendChild(el('span','box','✓')); b.appendChild(el('span','',t));
    b.addEventListener('click',function(){ S.checks[i]=!S.checks[i]; b.setAttribute('aria-pressed',S.checks[i]?'true':'false'); });
    list.appendChild(b);
  });
  v.appendChild(el('p','muted',parts[2]));
  v.appendChild(el('div','spacer'));
  btn(v,'Start again',function(){ fresh(); go(0); },'ghost');
}

render();
</script>

</body></html>
